name: Parfum kontrol
# Her calisma ~5 saat 45 dk boyunca dakikada bir kontrol eder.
# Zamanlayici her 5 dk bir yenisini kuyruga koyar; biri bitince digeri hemen baslar.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Sadece test e-postasi gonder"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kontrol
  cancel-in-progress: false
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kontrol (dakikada bir)
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          git config user.name "parfum-bot"
          git config user.email "parfum-bot@users.noreply.github.com"
          if [ "${{ inputs.test_mail }}" = "true" ]; then
            python kontrol.py --test-mail
          else
            python kontrol.py --loop 345 --git
          fi
