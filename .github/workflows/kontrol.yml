name: Parfum kontrol
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Test e-postasi gonder"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: kontrol
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kontrol
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python kontrol.py ${{ inputs.test_mail && '--test-mail' || '' }}
      - name: Durumu kaydet
        run: |
          git config user.name "parfum-bot"
          git config user.email "parfum-bot@users.noreply.github.com"
          git add bilinen_urunler.json yeni_urunler.log 2>/dev/null || git add bilinen_urunler.json
          git diff --cached --quiet || (git commit -m "Yeni urunler" && git push)
